name: Release

# Push a tag like v0.2.0 (it must match package.json) to test, publish to npm and
# create the GitHub release. Needs the NPM_TOKEN repository secret (an npm
# automation token with publish rights on the @botconnector scope).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Sandbox prerequisites
        run: |
          docker pull node:24-alpine
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm test
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::the NPM_TOKEN secret is not set, nothing was published"; exit 1; }
          # provenance needs a public repository
          if [ "$PRIVATE_REPO" = "false" ]; then npm publish --access public --provenance; else npm publish --access public; fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "Switchboard $version" --notes "${notes:-See CHANGELOG.md}" --verify-tag
