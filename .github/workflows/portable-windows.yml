name: Portable Windows Switchboard
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:plugin-catalog
      - name: Bundle Windows portable Node + uv + Switchboard
        shell: pwsh
        run: ./scripts/package-portable-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/bc-release"
      - name: Verify runnable bundle
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP/bc-release" -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No Windows bundle produced' }
          $test = Join-Path $env:RUNNER_TEMP 'portable-qa'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $test
          $root = Get-ChildItem $test -Directory | Select-Object -First 1
          & "$($root.FullName)/runtime/node.exe" "$($root.FullName)/app/dist/cli.js" --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Node app cannot start' }
          $env:SBX_PORTABLE_ROOT = $root.FullName
          & "$($root.FullName)/runtime/node.exe" scripts/test-portable-core-layout.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable sibling Core import or original CLI failed' }
          Remove-Item Env:SBX_PORTABLE_ROOT
          & "$($root.FullName)/runtime/uvx.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled uvx cannot start' }
          if (-not (Test-Path "$($root.FullName)/Start-Switchboard.cmd")) { throw 'Launcher missing' }
          if (-not (Test-Path "$($root.FullName)/Manage-Local-AI.cmd")) { throw 'Local model manager launcher missing' }
          if (-not (Test-Path "$($root.FullName)/Check-Local-AI.cmd")) { throw 'Local runtime status launcher missing' }
          if (-not (Test-Path "$($root.FullName)/local-core/LICENSE")) { throw 'Bundled BotConnector Local license missing' }
          if (-not (Test-Path "$($root.FullName)/local-core/dist/web/index.html")) { throw 'Bundled original model manager UI missing' }
          $coreRev = (Get-Content "$($root.FullName)/local-core/SOURCE-REVISION.txt" -Raw).Trim()
          if ($coreRev -notmatch '1aa37824ea5d6bcd35f499c892a68cecfa695660') { throw 'Unpinned original Core revision' }
          & "$($root.FullName)/runtime/node.exe" "$($root.FullName)/local-core/bin/botconnector.mjs" --help
          if ($LASTEXITCODE -ne 0) { throw 'Bundled original BotConnector Local CLI cannot start' }
          Write-Host 'PORTABLE_WINDOWS_QA_PASS_WITH_PINNED_LOCAL_CORE'
      - uses: actions/upload-artifact@v4
        with:
          name: switchboard-portable-win64
          path: ${{ runner.temp }}/bc-release/*
          if-no-files-found: error
      - name: Publish portable asset to same GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: pwsh
        run: |
          $exists = $false
          for ($i = 0; $i -lt 40; $i++) {
            gh release view "$env:TAG" *> $null
            if ($LASTEXITCODE -eq 0) { $exists = $true; break }
            Start-Sleep -Seconds 30
          }
          if (-not $exists) { throw 'GitHub Release did not appear after the tested Linux release workflow' }
          Get-ChildItem "$env:RUNNER_TEMP/bc-release" -File | ForEach-Object {
            gh release upload "$env:TAG" $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Portable release upload failed' }
          }
