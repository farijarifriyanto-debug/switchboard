name: Feature request
description: Propose a new Switchboard capability
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible with Switchboard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Desired behaviour and example usage.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Core harness change
        - New built-in tool
        - Plugin / MCP (prefer a third-party plugin — open an issue to discuss first)
        - Docs
        - Other
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Most new features should be **plugins**, not core changes — see
        [switchboard-plugin-examples](https://github.com/farijarifriyanto-debug/switchboard-plugin-examples)
        for the plugin API. Only propose a core change when a plugin cannot do it.
